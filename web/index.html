<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f7667" />
    <title>Smart Marketing</title>
    <script>
      // Applied before the first paint so the page never flashes in the wrong theme or direction.
      try {
        var lang = localStorage.getItem('smp.lang') === 'en' ? 'en' : 'ar'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        var theme = localStorage.getItem('smp.theme')
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
